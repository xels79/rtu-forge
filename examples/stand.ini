[devices]
relay_address = 1
output_address = 2

[output]
range = 0-20ma

; Пример поливной установки; адрес реле и пороги НЕ подтверждены на оборудовании.
; Не переносите true в подтверждения до проверки оборудования.
[irrigation]
enabled = false
ai_verified = false
; Особый raw=0 как 0 бар только после проверки соответствующего канала.
; Такой нуль не отличим от отсутствия сигнала, ток петли неизвестен.
ai1_zero_raw_is_zero = false
ai2_zero_raw_is_zero = false
vfd_verified = false
hydraulics_verified = false
protections_verified = false
pressure_unit_verified = false
relay_id_verified = false
pump1_drive = 7
pump2_drive = 8
rack1_pump = 1
rack2_pump = 2
; Минимумы моторов по адресам IDD, независимо от выбора стеллажа/НВД.
drive7_min_hz = 24
; Для IDD 8 отдельный минимум мотора не задан; применяется Pb06.
drive8_min_hz = 0
low_ready_bar = 1
low_min_bar = 0.5
high_target_bar = 60
high_min_bar = 50
high_max_bar = 70
hysteresis_bar = 0.2
valve_delay_ms = 2000
prime_timeout_ms = 10000
rise_timeout_ms = 20000
stop_timeout_ms = 15000
leak_delay_ms = 2000
poll_ms = 250
; Период вывода давления/тока и тайм-аут отдельного подтверждения Enter.
telemetry_ms = 1000
step_timeout_ms = 30000
stop_hz = 0.1
; Профиль по умолчанию не выбран. Для проверенной mini PLUS (IDD222M21E):
; run_register=28 (PA28), fault_register=27 (PA27); проверить через idd 7 feedback.
; Не заменять историей PA10 и не заимствовать карту другого частотника.
run_register = -1
run_mask = 1
fault_register = -1
fault_mask = 65535
setpoint_readback = false
