[devices]
relay_address = 1
output_address = 2

[output]
range = 0-20ma

; Пример поливной установки; адрес реле и пороги НЕ подтверждены на оборудовании.
; Не переносите true в подтверждения до проверки оборудования.
[irrigation]
enabled = false
ai_verified = false
vfd_verified = false
hydraulics_verified = false
protections_verified = false
pressure_unit_verified = false
relay_id_verified = false
pump1_drive = 7
pump2_drive = 8
rack1_pump = 1
rack2_pump = 2
low_ready_bar = 1
low_min_bar = 0.5
high_target_bar = 60
high_min_bar = 50
high_max_bar = 70
hysteresis_bar = 0.2
valve_delay_ms = 2000
prime_timeout_ms = 10000
rise_timeout_ms = 20000
stop_timeout_ms = 15000
leak_delay_ms = 2000
poll_ms = 250
stop_hz = 0.1
; RUN/текущая авария не определены в опубликованном руководстве IDD MINI.
; Не заменять историей PA10 и не заимствовать карту другого частотника.
run_register = -1
run_mask = 1
fault_register = -1
fault_mask = 65535
setpoint_readback = false
