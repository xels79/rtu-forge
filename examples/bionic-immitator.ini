[serial]
controller_port = COM1
controller_baudrate = 9600
controller_parity = N
controller_stopbits = 1.0
sensor_relay_port = COM2
sensor_relay_baudrate = 9600
sensor_relay_parity = N
sensor_relay_stopbits = 1.0

[devices]
sensor_relay_id = 1
sensor_relay_channels = 8
sensor_relay_active_low = false
sensor_relay_contact = NO
sensor_relay_map = bo-min:1,bo-max:2,bp-min:3,bp-max:4,bso1-min:5,bso1-max:6,bso2-min:7,bso2-max:8
sensor_relay_loss_behavior = unknown
relay_address = 1
ao1_address = 2
ao2_address = 3
ao3_address = 4
ai_address = 6
hp1_address = 7
hp2_address = 8

[simulation]
hardware_mode = false
model_interval_ms = 50
ui_interval_ms = 500
retention_days = 7
simulation_speed = 1.0

[tanks]
bo_capacity_l = 500.0
bp_capacity_l = 500.0
bso1_capacity_l = 200.0
bso2_capacity_l = 200.0
bo_initial_l = 250.0
bp_initial_l = 250.0
bso1_initial_l = 20.0
bso2_initial_l = 20.0
fill_flow_lpm = 3.0
bo_to_bp_flow_lpm = 10.0
bso1_to_bp_flow_lpm = 8.0
bso2_to_bp_flow_lpm = 8.0

[irrigation]
rack1_tier_flow_lpm = 2.0
rack2_tier_flow_lpm = 2.0
return_fraction = 0.8
return_delay_s = 5.0

[sensors]
bo_min_threshold_l = 100.0
bo_max_threshold_l = 400.0
bp_min_threshold_l = 100.0
bp_max_threshold_l = 400.0
bso1_min_threshold_l = 40.0
bso1_max_threshold_l = 160.0
bso2_min_threshold_l = 40.0
bso2_max_threshold_l = 160.0
sensor_hysteresis_l = 0.0
sensor_delay_s = 0.0

[equipment]
# equipment_profile хранит отдельный JSON-профиль развития повреждений пяти
# насосов. Если параметр отсутствует, используется заводской профиль.
# Редактируйте его командами `equipment set ...`, затем `settings apply/save`.

[pressure]
boost_pressure_bar = 2.0
boost_rise_s = 2.0
boost_fall_s = 2.0
pressure_rise_s = 5.0
pressure_fall_s = 4.0
valve_pressure_response_ms = 200
valve_pressure_close_response_ms = 200
transient_pressure_spike_coefficient = 0.0
transient_pressure_spike_duration_ms = 100
closed_head_pressure_bar = 90.0
pressure_max_bar = 90.0
rupture_threshold_bar = 75.0
rupture_residual_bar = 2.0

[faults]
leak_rate_lpm = 12.0
leak_pressure_factor = 0.25
blockage_severity = 70.0

[lighting]
# light_profile хранит JSON-профиль шести ярусов. Если параметр отсутствует,
# используется заводская карта Bionic Mini; редактируйте её через
# `view light settings`, затем `light apply` или `light save`.

[drive_hp1]
hp1_ramp_up_s = 5.0
hp1_ramp_down_s = 5.0
hp1_pb00 = 290
hp1_pb01 = 5
hp1_pb02 = 2
hp1_pb05 = 500
hp1_pb06 = 200
hp1_pc12 = 1460
hp1_pc15 = 500
hp1_ph00 = 1
hp1_ph01 = 3
# Следующие параметры — модель двигателя/защиты имитатора, не новые регистры IDD.
hp1_nominal_current_a = 16.0
hp1_no_load_current_a = 4.0
hp1_pump_load_coefficient = 1.0
hp1_jam_current_multiplier = 2.0
hp1_overload_trip_s = 60.0
hp1_overload_protection_enabled = true
hp1_overload_threshold_multiplier = 1.5
hp1_protection_behavior = latched_reset
hp1_mechanical_failure = none
hp1_mechanical_damage = 0.0

[drive_hp2]
hp2_ramp_up_s = 5.0
hp2_ramp_down_s = 5.0
hp2_pb00 = 290
hp2_pb01 = 5
hp2_pb02 = 2
hp2_pb05 = 500
hp2_pb06 = 200
hp2_pc12 = 1460
hp2_pc15 = 500
hp2_ph00 = 1
hp2_ph01 = 3
# Следующие параметры — модель двигателя/защиты имитатора, не новые регистры IDD.
hp2_nominal_current_a = 16.0
hp2_no_load_current_a = 4.0
hp2_pump_load_coefficient = 1.0
hp2_jam_current_multiplier = 2.0
hp2_overload_trip_s = 60.0
hp2_overload_protection_enabled = true
hp2_overload_threshold_multiplier = 1.5
hp2_protection_behavior = latched_reset
hp2_mechanical_failure = none
hp2_mechanical_damage = 0.0
