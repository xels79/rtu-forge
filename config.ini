[connection]
port = com4
baudrate = 9600
bytesize = 8
parity = E
stopbits = 1
timeout_ms = 1000

[runtime]
inter_command_delay_ms = 100
post_write_delay_ms = 0
response_silence_ms = 40
max_response_bytes = 256
crc_mode = auto
auto_connect = true
show_tx = true
show_rx = true
timestamps = false
uppercase_hex = true
decode_rx = true

[history]
file = .rtuforge_history
max_entries = 2000

[ui]
language = en
