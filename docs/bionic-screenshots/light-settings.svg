</text><text class="terminal-779094716-r1" x="0" y="68.8" textLength="1037" clip-path="url(#terminal-779094716-line-2)">F5:&#160;применить&#160;только&#160;свет&#160;|&#160;Ctrl+S:&#160;сохранить&#160;только&#160;свет&#160;|&#160;Esc:&#160;выйти&#160;без&#160;применения</text><text class="terminal-779094716-r1" x="2196" y="68.8" textLength="12.2" clip-path="url(#terminal-779094716-line-2)">
